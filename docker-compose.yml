# ping-shared — one shared instance per host of the Ping products and demo
# services that standalones need (rule 20 in ~/Development/STANDALONE-RULES.md).
# Labs join the external `ping-shared` network and reuse these instances; they
# never ship their own.
#
# Adopted (already running, not owned by this compose project):
#   Ping products:  ai-demo-pingfederate (admin 9999, runtime 9031), ai-demo-ping-gateway
#                   (3036), ai-demo-ping-mcpgw (8620/8623/8690, profile `mcpgw`)
#   MCP stack:      ai-demo-mcp-server (8080), mcp-gateway (3005), mcp-resource-server
#                   (8081, loopback), mcp-jwt-verifier (8083), api-resource-server (8082),
#                   authz-server (9001), mcp-proxy (8895), mcp-audit (8898), llm-proxy
#                   (8090), mcp-code-search (8095), opensearch-mcp-server (9900),
#                   mcp-weather (8896), mcp-brave (8897), bff/api-server (3001, TLS)
#   All from the AI-DEMO2 compose project. This project does NOT start seconds of them.
#
# Probe convention (rule 20 step 2): `node probe.mjs <product>` → exit 0 = reuse
# ("using shared <product> at <host:port>"), 1 = missing/unhealthy (offer to start,
# never silently), 2 = unknown product.
#
# Fallback (OFF by default): a host with NO AI-DEMO2 stack can start the MCP trio
# here with `docker compose --profile fallback up -d` — minimal mock MCP server +
# resource server so a lab's Real-ish mode still has peers. Do NOT enable this on
# a host that already runs the AI-DEMO2 stack (that would violate rule 20).

name: ping-shared

networks:
  ping-shared:
    name: ping-shared
    external: false

services:
  # ── Fallback MCP pair (profile `fallback`, OFF by default) ──────────────────
  # Only for hosts with no AI-DEMO2 stack. Minimal, mock, loopback-only.
  mock-mcp-server:
    image: busybox:1.36
    profiles: ["fallback"]
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    ports:
      - "127.0.0.1:18080:8080"
    networks: [ping-shared]
    labels:
      io.ping-shared.product: mock-mcp-server
    restart: unless-stopped
