name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.18.4
          curl -sSLO "$base/gitleaks_8.18.4_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_8.18.4_checksums.txt"
          grep ' gitleaks_8.18.4_linux_x64.tar.gz$' gitleaks_8.18.4_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo install gitleaks /usr/local/bin
      - name: Scan history and tree
        run: |
          gitleaks detect --source . --redact --verbose
          gitleaks detect --source . --redact --no-git
  probe-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26 }
      - name: unknown product answers exit 2, usage lists products
        run: |
          node probe.mjs not-a-product 2>/dev/null && { echo "unknown product should not exit 0"; exit 1; } || code=$?
          test "$code" = "2" || { echo "expected exit 2 for unknown product, got $code"; exit 1; }
          node probe.mjs 2>/dev/null && { echo "missing product should not exit 0"; exit 1; } || code=$?
          test "$code" = "2" || { echo "expected exit 2 for missing product, got $code"; exit 1; }
          echo "probe contract ok"

  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: No AI attribution (tree and commits since 2026-11-07)
        run: bash scripts/check-no-ai-attribution.sh
